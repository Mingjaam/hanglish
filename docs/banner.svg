<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <!-- README banner: the app icon, the name, and the one-line promise. -->
  <defs>
    <radialGradient id="glowKo" cx="0.2" cy="0.45" r="0.45">
      <stop offset="0" stop-color="#ff6b4a" stop-opacity=".28"/><stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowEn" cx="0.85" cy="0.3" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7a52"/><stop offset=".5" stop-color="#ff8f8a"/><stop offset="1" stop-color="#4cc3fa"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f3fa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#0c0e17"/>
  <rect width="1280" height="400" rx="28" fill="url(#glowKo)"/>
  <rect width="1280" height="400" rx="28" fill="url(#glowEn)"/>

  <!-- icon (same drawing as assets/icon.svg, scaled to 220 px) -->
  <g transform="translate(96 90) scale(0.43)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect x="92" y="122" width="328" height="306" rx="78" fill="#d4d9ea"/>
    <rect x="92" y="96" width="328" height="300" rx="78" fill="url(#cap)"/>
    <text x="148" y="190" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-weight="800" font-size="62" fill="#ff6b4a">한</text>
    <text x="318" y="186" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="800" font-size="66" fill="#29b4f2">a</text>
    <ellipse cx="206" cy="268" rx="21" ry="25" fill="#1d2033"/>
    <ellipse cx="306" cy="268" rx="21" ry="25" fill="#1d2033"/>
    <circle cx="213" cy="259" r="7" fill="#fff"/>
    <circle cx="313" cy="259" r="7" fill="#fff"/>
    <ellipse cx="166" cy="312" rx="24" ry="14" fill="#ff9f9f" opacity=".7"/>
    <ellipse cx="346" cy="312" rx="24" ry="14" fill="#ff9f9f" opacity=".7"/>
    <path d="M232 312 q24 26 48 0" fill="none" stroke="#1d2033" stroke-width="12" stroke-linecap="round"/>
  </g>

  <g font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <text x="380" y="150" font-size="72" font-weight="800" fill="#eef0f7">한글리쉬
      <tspan font-size="40" font-weight="700" fill="#38bdf8" dx="14">Hanglish</tspan>
    </text>
    <text x="382" y="212" font-size="30" font-weight="700" fill="#eef0f7">그냥 치세요.
      <tspan fill="#ff6b4a">한글</tspan>인지 <tspan fill="#38bdf8">English</tspan>인지 고르는 건 저희가.
    </text>
    <text x="382" y="256" font-size="20" fill="#9aa1bb">한/영 키 없이 두벌식 그대로 · Windows와 macOS · 내 컴퓨터 안에서만 동작</text>
  </g>

  <!-- keys → result chips -->
  <g font-family="Consolas, Menlo, monospace" font-size="20">
    <rect x="382" y="292" width="232" height="46" rx="12" fill="#1b1f33"/>
    <text x="400" y="322" fill="#9aa1bb">dkssud <tspan fill="#5d6585">→</tspan> <tspan fill="#ff6b4a" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">안녕</tspan></text>
    <rect x="630" y="292" width="300" height="46" rx="12" fill="#1b1f33"/>
    <text x="648" y="322" fill="#9aa1bb">githubdptj <tspan fill="#5d6585">→</tspan> <tspan fill="#38bdf8" font-weight="700">github</tspan><tspan fill="#ff6b4a" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-weight="700">에서</tspan></text>
    <rect x="946" y="292" width="200" height="46" rx="12" fill="#1b1f33"/>
    <text x="964" y="322" fill="#9aa1bb">hello <tspan fill="#5d6585">→</tspan> <tspan fill="#38bdf8" font-weight="700">hello</tspan></text>
  </g>
</svg>
