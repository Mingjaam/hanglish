name: build

# Every push builds and tests both apps. A tag like v0.2.1 also publishes a GitHub Release with
# the installers (Hanglish-Setup.exe, Hanglish.dmg) and portable zips, which the website links to.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Engine tests
        run: dotnet run --project src/Hanglish.Eval -c Release -- --engine
      - name: Accuracy on held-out sentences
        run: dotnet run --project src/Hanglish.Eval -c Release --no-build -- --corpus tests/corpus/ko_test.txt tests/corpus/en_test.txt tests/corpus/mixed_test.txt tests/corpus/name_test.txt
      - name: Publish
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0" }
          "VERSION=$version" >> $env:GITHUB_ENV
          # Folder for the installer (it compresses the runtime better than a single file does).
          dotnet publish src/Hanglish/Hanglish.csproj -c Release -r win-x64 --self-contained true `
            -p:DebugType=none -p:Version=$version -o out/Hanglish
          # Portable single file for people who would rather not install.
          dotnet publish src/Hanglish/Hanglish.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none -p:Version=$version -o out/portable
          Copy-Item README.md out/portable/
          Compress-Archive -Path out/portable/* -DestinationPath out/Hanglish-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          # Inno Setup 7 from its signed GitHub release, installed for this user only.
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile innosetup.exe
          Start-Process ./innosetup.exe -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER /DIR="C:\inno" /NOICONS' -Wait
          & C:\inno\ISCC.exe /Q "/DVersion=$env:VERSION" "/DSource=$PWD\out\Hanglish" installer\Hanglish.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/Hanglish-Setup.exe
            out/Hanglish-windows-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lexicon
        run: sh mac/scripts/prepare.sh
      - name: Engine tests (including parity with the Windows engine)
        working-directory: mac
        run: swift test
      - name: Import signing certificate
        # Skipped quietly when the secrets are not set (forks, or before the certificate exists).
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$MAC_CERT_P12" ]; then echo "No signing certificate; building with an ad-hoc signature."; exit 0; fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$identity" ]; then echo "::error::No Developer ID Application identity in the certificate"; exit 1; fi
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "Signing as: $identity"
      - name: Build app
        env:
          MAC_NOTARY_APPLE_ID: ${{ secrets.MAC_NOTARY_APPLE_ID }}
          MAC_NOTARY_PASSWORD: ${{ secrets.MAC_NOTARY_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.MAC_TEAM_ID }}
        run: |
          version=0.0.0
          if [ "${{ github.ref_type }}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; fi
          mkdir -p out
          sh mac/scripts/bundle.sh "$version" "$PWD/out"
      - name: Check disk image layout
        run: |
          # The custom window needs its background image and the Finder layout file inside the image.
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/hanglish-dmg out/Hanglish.dmg
          ls -la /tmp/hanglish-dmg
          test -f /tmp/hanglish-dmg/.DS_Store
          test -f /tmp/hanglish-dmg/.background.tiff
          test -f /tmp/hanglish-dmg/.VolumeIcon.icns
          test -L /tmp/hanglish-dmg/Applications
          test -d /tmp/hanglish-dmg/Hanglish.app
          hdiutil detach /tmp/hanglish-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            out/Hanglish.dmg
            out/Hanglish-macos.zip

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Hanglish-Setup.exe
            out/Hanglish.dmg
            out/Hanglish-windows-x64.zip
            out/Hanglish-macos.zip
          generate_release_notes: true

  site:
    if: github.ref == 'refs/heads/main'   # the github-pages environment only accepts main
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
