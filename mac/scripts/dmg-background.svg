<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 400" width="660" height="400">
  <!-- Background of the macOS disk image window. Icons sit at (165, 205) and (495, 205); see dmg_settings.py.
       Kept light: Finder draws the icon labels in dark text. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6f2"/>
      <stop offset=".55" stop-color="#fbf9fb"/>
      <stop offset="1" stop-color="#eef7fd"/>
    </linearGradient>
    <radialGradient id="ko" cx=".18" cy=".55" r=".4">
      <stop offset="0" stop-color="#ff6b4a" stop-opacity=".14"/><stop offset="1" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="en" cx=".82" cy=".55" r=".4">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 12" refX="7" refY="6" markerWidth="12" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L9 6 L1 11" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#ko)"/>
  <rect width="660" height="400" fill="url(#en)"/>

  <!-- soft rings where the two icons land -->
  <circle cx="165" cy="205" r="86" fill="#ffffff" opacity=".7"/>
  <circle cx="495" cy="205" r="86" fill="#ffffff" opacity=".7"/>
  <circle cx="165" cy="205" r="86" fill="none" stroke="#ff6b4a" stroke-opacity=".18" stroke-width="1.5"/>
  <circle cx="495" cy="205" r="86" fill="none" stroke="#38bdf8" stroke-opacity=".22" stroke-width="1.5" stroke-dasharray="5 6"/>

  <!-- the move: app → Applications -->
  <path d="M268 196 C 310 160, 350 160, 392 196" fill="none" stroke="url(#arrow)" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="1 9" marker-end="url(#head)"/>

  <g font-family="Apple SD Gothic Neo, Malgun Gothic, Noto Sans KR, sans-serif" text-anchor="middle">
    <text x="330" y="62" font-size="22" font-weight="800" fill="#191b26">한글리쉬 설치</text>
    <text x="330" y="90" font-size="13.5" fill="#6b7085">한글리쉬를 <tspan fill="#1688c4" font-weight="700">응용 프로그램</tspan> 폴더로 끌어다 놓으세요</text>
    <text x="330" y="364" font-size="11.5" fill="#9095a8">처음 열 때 시스템 설정 → 개인정보 보호 및 보안에서 손쉬운 사용을 허용해 주세요</text>
  </g>

  <!-- little dual-legend keycaps as decoration -->
  <g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" font-weight="700">
    <g transform="translate(36 30) rotate(-8)" opacity=".55">
      <rect width="34" height="34" rx="8" fill="#fff" stroke="#e4e6ee"/>
      <text x="8" y="15" font-size="10" fill="#1688c4" font-family="Menlo, Consolas, monospace">g</text>
      <text x="26" y="28" font-size="12" fill="#e2552f" text-anchor="end">ㅎ</text>
    </g>
    <g transform="translate(594 318) rotate(9)" opacity=".55">
      <rect width="34" height="34" rx="8" fill="#fff" stroke="#e4e6ee"/>
      <text x="8" y="15" font-size="10" fill="#1688c4" font-family="Menlo, Consolas, monospace">k</text>
      <text x="26" y="28" font-size="12" fill="#e2552f" text-anchor="end">ㅏ</text>
    </g>
    <g transform="translate(604 34) rotate(6)" opacity=".4">
      <rect width="28" height="28" rx="7" fill="#fff" stroke="#e4e6ee"/>
      <text x="7" y="12" font-size="9" fill="#1688c4" font-family="Menlo, Consolas, monospace">s</text>
      <text x="21" y="23" font-size="10" fill="#e2552f" text-anchor="end">ㄴ</text>
    </g>
  </g>
</svg>
